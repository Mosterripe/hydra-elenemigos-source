name: Actualizar Fuente de Elenemigos

on:
  schedule:
    - cron: '0 0 * * *' # Ejecución diaria a medianoche
  workflow_dispatch: # Permite ejecutar el flujo manualmente

permissions:
  contents: write # Concede permisos para subir cambios al repositorio

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Ejecutar Scraper
        run: python scraper.py

      - name: Guardar cambios en el JSON
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add elenemigos.json
          git commit -m "Auto-update: Fuente de Elenemigos actualizada" || exit 0
          git push
